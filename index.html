    /* ─── 搜索（回车/放大镜）───
     * 1) 有完全对应的节点（中文名/英文名/id 精确相等）→ 聚焦该节点
     * 2) 无精确命中 → 三档高亮：标题含字段最亮 / 内容含字段其次 / 其余打暗，不聚焦 */
    function doSearch(){
      sfxPlay("tick");
      var raw = document.getElementById("searchInput").value.trim();
      if (!raw) return;
      var q = raw.toLowerCase();
      var exact = DATA.nodes.find(function(n){
        return (n.name || "") === raw
          || (n.en || "").toLowerCase() === q
          || (n.id || "").toLowerCase() === q;
      });
      if (exact){
        if (!chkState[exact.type]){
          chkState[exact.type] = true;
          var lr = legendItems.querySelector('.lrow[data-type="'+exact.type+'"]');
          if (lr) lr.classList.remove('off');
          if (exact.type === "heritage") ensureHeritageNodeLoaded(exact);
          applyFilter();
        } else if (exact.type === "heritage") {
          ensureHeritageNodeLoaded(exact);
        }
        setTimeout(function(){ clickNode(exact); }, exact.type === "heritage" ? 24 : 0);
        return;
      }
      /* 无精确命中：分档高亮 */
      var anyHit = false;
      DATA.nodes.forEach(function(n){
        var title = (n.name || "") + " " + (n.en || "");
        var tHit = title.indexOf(raw) >= 0 || title.toLowerCase().indexOf(q) >= 0;
        var cHit = false;
        if (!tHit){
          var blob = (n.desc || "") + (n.detail || "") + (n.enDesc || "") + (n.enDetail || "");
          cHit = blob.indexOf(raw) >= 0 || blob.toLowerCase().indexOf(q) >= 0;
        }
        n.__searchT = tHit ? 1 : (cHit ? 0.55 : 0.15);
        n.__searchB = tHit ? 1 : 0;
        if (tHit || cHit) anyHit = true;
      });
      if (anyHit){
        _searchActive = true;
      } else {
        DATA.nodes.forEach(function(n){ n.__searchT = 1; n.__searchB = 0; });
        _searchActive = false;
        var inp = document.getElementById("searchInput");
        inp.style.borderColor = "rgba(192,57,43,.9)";
        inp.title = "未找到：可试 乔家 / 朗色林 / 西递 / 热河 / 园冶";
        setTimeout(function(){ inp.style.borderColor = ""; }, 1200);
      }
    }
    document.getElementById("searchBtn").addEventListener("click", doSearch);
    document.getElementById("searchInput").addEventListener("keydown", function(e){
      if (e.key === "Enter") doSearch();
    });

    /* ─── 实时检索过滤：标题含检索字段的节点保留，其余平滑淡出（IME 输入中不触发）
     * __searchT: 目标权重 0~1；__searchB: 发光加成（回车高亮时标题命中=1） ─── */
    var _searchActive = false;

    function applyLiveSearch(){
      var q = document.getElementById("searchInput").value.trim().toLowerCase();
      _searchActive = q.length > 0;

        var hit = !_searchActive ||
          (n.name || "").toLowerCase().indexOf(q) >= 0 ||

    /* ─── 标签叠层（与节点同色；可 hover/点击，反应与节点一致） ─── */

        if (nd) safeActivateNode(nd);
      });
      d.addEventListener("touchstart", function(e){
        if (!e.touches[0]) return;

        labelSx = e.touches[0].clientX;
        labelSy = e.touches[0].clientY;
      }, {passive:true});
      d.addEventListener("touchmove", function(e){
        if (!e.touches[0]) return;
        var dx = e.touches[0].clientX - labelSx;
        var dy = e.touches[0].clientY - labelSy;
        if (dx * dx + dy * dy > 64) labelMoved = true;
      }, {passive:true});
      d.addEventListener("touchend", function(e){
        labelTouchAt = Date.now();
        e.preventDefault();
        e.stopPropagation();
        if (labelMoved || touchGuard.moved || touchGuard.multi) return;
        if (Date.now() < touchGuard.suppressUntil) return;
        var nd = nodeById(n.id);

      }, {passive:false});
      labelLayer.appendChild(d);

    /* 滚轮落在标签上时转发给画布，保证任何位置都能缩放 */

        clientX: e.clientX, clientY: e.clientY,
        ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey,
        bubbles: true, cancelable: true

    function projectLabels(){
      if (!showLabels) return;
      var cam = Graph.camera();
      var w = graphEl.clientWidth, h = graphEl.clientHeight;
      var P = cam.projectionMatrix.elements, V = cam.matrixWorldInverse.elements;
      var vp = new Array(16);
      for (var c = 0; c < 4; c++) for (var rr = 0; rr < 4; rr++){
        var s = 0; for (var k = 0; k < 4; k++){ s += P[k*4+rr] * V[c*4+k]; }
        vp[c*4+rr] = s;
      }
      var visibleIds = {};
      (Graph.graphData().nodes || []).forEach(function(n){ visibleIds[n.id] = true; });
      var any = Object.keys(highlightNodes).length > 0;
      DATA.nodes.forEach(function(n){
        var el = labelEls[n.id];
        if (!visibleIds[n.id]){ el.style.display = "none"; return; }
        var x = n.x || 0, y = n.y || 0, z = n.z || 0;
        var cw = vp[3]*x + vp[7]*y + vp[11]*z + vp[15];
        if (cw <= 0){ el.style.display = "none"; return; }
        var cx = vp[0]*x + vp[4]*y + vp[8]*z + vp[12];
        var cy = vp[1]*x + vp[5]*y + vp[9]*z + vp[13];
        var sx = (cx/cw*0.5 + 0.5) * w;
        var sy = (1 - (cy/cw*0.5 + 0.5)) * h;
        el.style.display = "block";
        el.style.left = sx + "px";
        el.style.top = sy + "px";
        /* 标签与节点同色；立体度阶梯更陡，远景标签可隐藏减负 */
        var atten = getDepthAttenuation(n.x||0, n.y||0, n.z||0, _camPos);
        if (forceDepth > 0.15 && atten < 0.22 && n.id !== _focusedNodeId && !(any && highlightNodes[n.id])) {
          el.style.display = "none";
          return;
        }
        var matOp = (n.__mat && typeof n.__mat.opacity === "number") ? n.__mat.opacity : atten;
        var hlW = any && highlightNodes[n.id] ? highlightNodes[n.id] : 0;
        var nearFar = (forceDepth < 0.01) ? 1 : Math.pow(atten, 0.75 + forceDepth * 1.35);
        /* hover 高亮标签覆盖深度衰减，小比例尺下也保持醒目 */
        if (hlW > 0) nearFar = nearFar + (1 - nearFar) * Math.min(1, hlW);
        /* 检索淡出：标签随节点权重渐隐，权重极低时直接隐藏 */
        var sw = (n.__searchW == null) ? 1 : n.__searchW;
        if (sw < 0.05){ el.style.display = "none"; return; }
        var baseLabOp = Math.max(LABEL_MIN_OPACITY, matOp * nearFar);
        el.style.opacity = Math.min(1, baseLabOp * (hlW > 0 ? (1.08 + hlW * 0.25) : 1) * sw);
        el.classList.toggle("hovered", hlW > 0.5);
        var depthScale = (1 - forceDepth) * 1.0 + forceDepth * (0.38 + 0.62 * nearFar);
        var isFocused = (n.id === _focusedNodeId);
        var sizeBoost = isFocused ? 1.28 : (hlW > 0.5 ? 1.12 : 1.0);
        var zhSize = Math.max(8, Math.round(forceLabelSize * depthScale * sizeBoost));
        var enSize = Math.max(7, Math.round(forceLabelSize * 0.7 * depthScale * sizeBoost));
        var zhEl = el.querySelector(".nl-zh");
        var enEl = el.querySelector(".nl-en");
        if (zhEl) zhEl.style.fontSize = zhSize + "px";
        if (enEl) enEl.style.fontSize = enSize + "px";
        /* 强制与节点材质同色（含着色明度），禁止标签另色 */
        if (n.__mat && n.__mat.color) {
          var mc = n.__mat.color;
          el.style.color = "rgb(" + Math.round(mc.r*255) + "," + Math.round(mc.g*255) + "," + Math.round(mc.b*255) + ")";
        } else if (n.__baseColor) {
          var bc = n.__baseColor;
          var lift = Math.max(0, forceColorLight || 0);
          var r = Math.round((bc.r + (1-bc.r)*lift) * 255);
          var g = Math.round((bc.g + (1-bc.g)*lift) * 255);
          var b = Math.round((bc.b + (1-bc.b)*lift) * 255);
          el.style.color = "rgb(" + r + "," + g + "," + b + ")";
        } else {
          el.style.color = TYPE_COLORS[n.type] || "#eee";
        }
      });
    }

            if (d2 < maxD2) candidates.push({i1:i1, i2:i2, d2:d2});
          }
        }
        candidates.sort(function(u,v){ return u.d2 - v.d2; });
        var keep = Math.min(nd.maxLinks, candidates.length);

        var lp = nd.linkPos, lc = nd.linkCol;

        for (var ci = 0; ci < keep; ci++) {

          var life = nd.active[key] != null ? Math.min(1, nd.active[key] + dt * 2.2) : 0.15;

          lp[o+3]=pb.x; lp[o+4]=pb.y; lp[o+5]=pb.z;
          var cr = 0.45 + 0.35 * distN, cg = 0.75 + 0.15 * distN, cb = 0.82;

        }

      }

      // ─── 自然浮动：位移加在节点坐标上，mesh 中心始终在原点，连线/标签同步跟随 ───
      var gNodes = Graph.graphData().nodes || [];
      var _bxMin=Infinity,_byMin=Infinity,_bzMin=Infinity,_bxMax=-Infinity,_byMax=-Infinity,_bzMax=-Infinity;
      for (var ni=0; ni<gNodes.length; ni++){
        var n = gNodes[ni]; var m = n.__mesh; if(!m) continue;
        if ((n.x||0) < _bxMin) _bxMin = n.x||0; if ((n.x||0) > _bxMax) _bxMax = n.x||0;
        if ((n.y||0) < _byMin) _byMin = n.y||0; if ((n.y||0) > _byMax) _byMax = n.y||0;
        if ((n.z||0) < _bzMin) _bzMin = n.z||0; if ((n.z||0) > _bzMax) _bzMax = n.z||0;
        var ph = n.__phase || 0;
        var hl = !!highlightNodes[n.id];
        var breath = perfMode ? 1 : (1 + 0.045*Math.sin(t*0.85 + ph) + 0.025*Math.sin(t*1.35 + ph*1.7));

        var swT = _searchActive ? ((n.__searchT == null) ? 1 : n.__searchT) : 1;
        var sw = (n.__searchW == null) ? 1 : n.__searchW;

        n.z = (n.z || 0) - pfz + fz;

      for (var lj=0; lj<gLinks.length; lj++){

          LINK_MIN_OPACITY,
          Math.min(0.85, link.__baseOpacity * depthLink * linkBoost * (0.55 + forceLinkGlow * 0.45))
        ) * lsw;

      }

        /* 不跟随相机：只极慢自转，像遥远天幕 */
        liangSky.rotation.y += dt * 0.0007;
        if (heavy) {
          for (var fi = 0; fi < liangFigs.length; fi++){
            var F = liangFigs[fi];
            var aArr = F.pts.geometry.attributes.alpha.array;
            for (var si2 = 0; si2 < F.count; si2++){
              aArr[si2] = F.baseA[si2] * (0.38 + 0.62 * (0.5 + 0.5 * Math.sin(t * F.spd[si2] + F.phase[si2])));
            }
            F.pts.geometry.attributes.alpha.needsUpdate = true;
            if (F.lines && F.lines.material){
              F.lines.material.opacity = 0.16 + 0.08 * (0.5 + 0.5 * Math.sin(t * 0.18 + fi));
            }
            if (F.sats.length){
              var pArr2 = F.pts.geometry.attributes.position.array;
              var bArr = F.branch.geometry.attributes.position.array;
              for (var sj = 0; sj < F.sats.length; sj++){
                var sat = F.sats[sj];
                var ax2 = pArr2[sat.anchor*3], ay2 = pArr2[sat.anchor*3+1], az3 = pArr2[sat.anchor*3+2];
                var wob = Math.sin(t * sat.sp + sat.ph);
                var wob2 = Math.cos(t * sat.sp * 0.8 + sat.ph * 1.7);
                var sx2 = ax2 + sat.ox + wob * sat.amp;
                var sy2 = ay2 + sat.oy + wob2 * sat.amp;
                pArr2[sat.idx*3] = sx2; pArr2[sat.idx*3+1] = sy2;
                bArr[sj*6]   = ax2; bArr[sj*6+1] = ay2; bArr[sj*6+2] = az3;
                bArr[sj*6+3] = sx2; bArr[sj*6+4] = sy2; bArr[sj*6+5] = pArr2[sat.idx*3+2];
              }
              F.pts.geometry.attributes.position.needsUpdate = true;
              F.branch.geometry.attributes.position.needsUpdate = true;
            }
          }
        }
      }

      // 著名天文星座：更远一层，反向极慢漂移 + 冷色闪烁
      if (!perfMode && astroSky) {
        astroSky.rotation.y -= dt * 0.00045;
        if (heavy) {
          for (var ai2 = 0; ai2 < astroFigs.length; ai2++){
            var AF = astroFigs[ai2];
            var aa = AF.pts.geometry.attributes.alpha.array;
            for (var sj2 = 0; sj2 < AF.count; sj2++){
              aa[sj2] = AF.baseA[sj2] * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * AF.spd[sj2] + AF.phase[sj2])));
            }
            AF.pts.geometry.attributes.alpha.needsUpdate = true;
            if (AF.lines && AF.lines.material){
              AF.lines.material.opacity = 0.20 + 0.10 * (0.5 + 0.5 * Math.sin(t * 0.14 + ai2 * 0.7));
            }
          }
        }
      }

      // v6: 旧星云已删除
      if (sky) sky.rotation.y += dt*0.005;
      if (grat) grat.rotation.y += dt*0.01;

      if (!perfMode) updateMeteors(dt);

      projectLabels();
      if (controls.autoRotate) controls.update();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    window.addEventListener("resize", function(){
      Graph.width(graphEl.clientWidth).height(graphEl.clientHeight);
      resizeMeteorCanvas();
    });
  })();
  </script>
  <canvas id="meteorLayer" aria-hidden="true"></canvas>
</body>
</html>
