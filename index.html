<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tenennium · 榫卯 · 木构千年</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="apple-touch-icon" href="assets/favicon.svg" />
<link rel="preload" as="font" type="font/woff" crossorigin
  href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/files/noto-sans-sc-chinese-simplified-700-normal.woff" />
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="https://cdn.jsdelivr.net/npm/@chinese-fonts/smileysans@1.0.0/dist/SmileySans/result.woff2" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1410" />
<!-- Furion Alt: Orbitron (现代未来主义) | Smiley Sans 得意黑 | Glow Sans SC 未来荧黑 -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600&family=Questrial&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
<!-- LED 环带字体：HarmonyOS Sans SC（中）+ Avant Garde 风格几何无衬线（英，Questrial/Poppins 兜底） -->
<link href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/Regular.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/Bold.css" rel="stylesheet" />
<style>
  /* ─── 中文字体 @font-face v4 ─── */
  @font-face{font-family:"Glow Sans SC"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/glowsans@1.3.0/dist/GlowSansSC-Normal/GlowSansSC-Normal-Light.woff2") format("woff2"); font-weight:300; font-style:normal;}
  @font-face{font-family:"Glow Sans SC"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/glowsans@1.3.0/dist/GlowSansSC-Normal/GlowSansSC-Normal-Regular.woff2") format("woff2"); font-weight:400; font-style:normal;}
  @font-face{font-family:"Glow Sans SC"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/glowsans@1.3.0/dist/GlowSansSC-Normal/GlowSansSC-Normal-Medium.woff2") format("woff2"); font-weight:500; font-style:normal;}
  @font-face{font-family:"Glow Sans SC"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/glowsans@1.3.0/dist/GlowSansSC-Normal/GlowSansSC-Normal-Bold.woff2") format("woff2"); font-weight:700; font-style:normal;}
  @font-face{font-family:"Smiley Sans"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/smileysans@1.0.0/dist/SmileySans/result.woff2") format("woff2"); font-weight:400; font-style:normal;}
  @font-face{font-family:"Smiley Sans"; src:url("https://cdn.jsdelivr.net/npm/@chinese-fonts/smileysans@1.0.0/dist/SmileySans/result.woff2") format("woff2"); font-weight:700; font-style:normal;}
  :root{
    --bg0:#1a1410; --bg1:#2a1f15; --ink:#15110c;
    --zhu:#C0392B; --jin:#C9A227; --tian:#7FB3C4; --paper:#E9DCC0;
    --panelBg:rgba(22,17,12,0.96); --panelBorder:rgba(201,162,39,0.35);
    /* ─── 字体体系 v4 ─── */
    --font-furion:"Orbitron",system-ui,-apple-system,sans-serif;        /* UI 装饰英文 */
    --font-en:"Exo 2","Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif; /* 英文正文：科技感无衬线，易读 */
    --font-entech:"Rajdhani","Exo 2","Orbitron",system-ui,sans-serif;   /* 节点英文名：科技感无衬线 */
    --font-glow:"Glow Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; /* 中文：未来荧黑 */
    --font-smiley:"Smiley Sans","Glow Sans SC","Noto Sans SC","PingFang SC",sans-serif;    /* 标题：得意黑 */
    --font-ming:"Noto Serif SC","Source Han Serif SC","STZhongsong","SimSun",serif;         /* 古文摘录：明体 */
    --font-base: var(--font-glow);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; overflow:hidden; background:#0a0806;
    font-family:var(--font-base); color:var(--paper);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    overscroll-behavior:none; position:fixed; inset:0;}
  #graph{position:fixed; inset:0;
    background:radial-gradient(circle at 50% 40%, #1c1410 0%, #0f0b08 60%, #060403 100%);
    -webkit-user-select:none; user-select:none; touch-action:none;}
  #graph canvas{touch-action:none; -webkit-user-drag:none;}
  #meteorLayer{position:fixed; inset:0; z-index:28; pointer-events:none; opacity:.42;}
  #labels{position:fixed; inset:0; pointer-events:none; z-index:5;
    -webkit-user-select:none; user-select:none;}
  .node-label{
    position:absolute; transform:translate(-50%,-235%); text-align:center; white-space:nowrap;
    letter-spacing:.5px; text-shadow:0 0 6px rgba(0,0,0,.95), 0 0 3px rgba(201,162,39,.55);
    padding:0 2px; transition:opacity .2s, filter .2s, transform .2s; will-change:left,top; font-weight:600; line-height:1.15;
    pointer-events:auto; cursor:pointer;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .node-label .nl-zh{font-size:14px; display:block; font-family:var(--font-base);}
  .node-label .nl-en{font-size:10px; display:block; opacity:.82; letter-spacing:.8px; font-weight:600; font-family:var(--font-entech); font-style:normal; text-transform:none;}
  /* v9 焦点节点标签：金色辉光 + 透明度拉满（字号在 JS 中 1.3× 放大） */
  .node-label.focused{z-index:6;}
  .node-label.focused .nl-zh{text-shadow:0 0 10px rgba(201,162,39,.95), 0 0 22px rgba(201,162,39,.45), 0 0 4px rgba(0,0,0,1);}
  .node-label.focused .nl-en{opacity:1; text-shadow:0 0 6px rgba(201,162,39,.6), 0 0 3px rgba(0,0,0,.9);}
  .node-label.hovered{z-index:7; filter:brightness(1.35);}
  .node-label.hovered .nl-zh{text-shadow:0 0 10px rgba(201,162,39,.9), 0 0 18px rgba(201,162,39,.4), 0 0 4px rgba(0,0,0,1);}
  .node-label.hovered .nl-en{opacity:1;}

  /* 顶栏 */
  #topbar{position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:flex-start;
    gap:16px; padding:14px 10px 14px 22px;
    padding-top:max(14px, env(safe-area-inset-top));
    padding-left:max(22px, env(safe-area-inset-left));
    padding-right:max(10px, env(safe-area-inset-right));
    background:linear-gradient(180deg, rgba(10,8,6,.88), rgba(10,8,6,0));}
  #topbar .title{font-family:var(--font-smiley); font-size:68px; font-weight:700; color:var(--paper);
    text-shadow:0 0 22px rgba(201,162,39,.55), 0 0 40px rgba(201,162,39,.2); line-height:1.05; letter-spacing:6px;
    white-space:normal; word-break:keep-all; max-width:50vw;}
  #topbar .title-zh{display:inline; letter-spacing:inherit;}
  #topbar .title-row{display:inline;}
  #topbar .title-row .dot{color:var(--jin);}
  #topbar .title-row:nth-child(2)::before{content:" · "; color:var(--jin);}
  #topbar .title-row:nth-child(2) .dot{display:none;}
  #topbar .title small{display:block; font-family:var(--font-furion); font-size:16px; letter-spacing:2.5px; color:var(--jin);
    font-weight:600; opacity:.9; margin-top:5px; font-style:italic;}
  #search{margin-left:auto; display:flex; gap:6px; align-items:center; flex-shrink:0;}
  #search input{width:260px; padding:8px 12px; border:1px solid var(--panelBorder);
    background:var(--panelBg); color:var(--paper); border-radius:10px;
    font-family:var(--font-base); font-size:13px; outline:none; transition:border-color .2s;}
  #search input:focus{border-color:var(--jin);}
  #search input::placeholder{
    color:rgba(233,220,192,.42);
    font-size:11px; font-style:italic; letter-spacing:.3px;
  }
  #search button{border:1px solid var(--panelBorder); border-radius:10px; cursor:pointer;
    background:var(--panelBg); color:var(--jin); font-size:18px; line-height:1;
    box-shadow:0 0 10px rgba(201,162,39,.25); transition:all .2s;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;}
  #search button:hover{background:rgba(201,162,39,.12); box-shadow:0 0 18px rgba(201,162,39,.5); color:#fff;}

  /* ─── 左侧面板组：flex column，展开推开下方 —— v9 统一样式 ─── */
  #leftPanels{
    position:fixed; left:18px; bottom:18px; z-index:22;
    left:max(18px, env(safe-area-inset-left));
    bottom:max(18px, env(safe-area-inset-bottom));
    max-width:250px; display:flex; flex-direction:column; gap:6px;
  }
  /* 面板共用样式 */
  .panel-card{
    background:var(--panelBg); border:1px solid var(--panelBorder);
    border-radius:10px; overflow:hidden;
    backdrop-filter:blur(4px); box-shadow:0 0 20px rgba(0,0,0,.45);
    transition:margin .25s ease;
  }
  .panel-card .handle{cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; user-select:none;}
  .panel-card .handle:hover{background:rgba(201,162,39,.06);}
  .panel-card .handle .label{font-size:13px; color:var(--jin); letter-spacing:1.5px; font-weight:600; font-family:var(--font-base);}
  .panel-card .handle h4{font-size:13px; color:var(--jin); letter-spacing:1px; margin:0; font-family:var(--font-base);}
  .panel-card .handle .arr{font-size:10px; color:var(--jin); transition:transform .3s;}
  .panel-card .body{max-height:calc(100vh - 140px); padding:0 12px 12px;
    transition:max-height .35s ease,opacity .3s,padding .35s; overflow:hidden auto;
    scrollbar-width:thin; scrollbar-color:rgba(201,166,107,.35) transparent;}
  .panel-card.closed .body{max-height:0; opacity:0; padding-top:0; padding-bottom:0;}
  .panel-card.closed .handle .arr{transform:rotate(-90deg);}
  #paramPanel h3{font-size:13px; color:var(--jin); margin-bottom:10px; letter-spacing:1px;
    border-bottom:1px solid var(--panelBorder); padding-bottom:6px; font-family:var(--font-base);}
  #paramPanel .group{margin-bottom:8px;}
  #paramPanel .group label{display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; color:var(--paper); margin-bottom:3px; letter-spacing:.2px;}
  #paramPanel .group label .val{font-size:10px; color:var(--jin); font-weight:600; min-width:30px; text-align:right;}
  #paramPanel .group input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
    background:linear-gradient(90deg, rgba(201,162,39,.25), rgba(201,162,39,.55));
    outline:none; cursor:pointer; touch-action:none;
  }
  #paramPanel .group input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--jin); box-shadow:0 0 8px rgba(201,162,39,.5); cursor:pointer;
  }
  #paramPanel .btn-row{display:flex; gap:6px; margin-top:10px;}
  #paramPanel .btn-row button{
    flex:1; padding:6px 0; border:1px solid var(--panelBorder); border-radius:7px;
    background:rgba(201,162,39,.08); color:var(--paper); font-family:var(--font-base);
    font-size:11px; cursor:pointer; transition:all .2s; letter-spacing:.3px;
  }
  #paramPanel .btn-row button:hover{background:rgba(201,162,39,.22); border-color:var(--jin);}
  #paramPanel .btn-row button.primary{background:linear-gradient(135deg,rgba(201,162,39,.4),rgba(157,125,24,.35));
    border-color:var(--jin); color:#fff; font-weight:600;}
  /* paramPanel body：展开时可滚动，隐藏滚动条 */
  #paramPanel .body{overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  #paramPanel .body::-webkit-scrollbar{display:none;}
  #paramPanel.closed .body{overflow:hidden;}
  /* legend body：展开时不滚动 */
  #legend .body{overflow:hidden;}
  /* v6 图例行：点击点亮/熄灭，无 checkbox */
  #legend .lrow{cursor:pointer; display:flex; align-items:center; gap:7px;
    font-size:12px; padding:3px 0; color:var(--paper); font-family:var(--font-base);
    transition:color .25s,opacity .25s; user-select:none;}
  #legend .lrow:hover{color:#fff;}
  #legend .lrow.off{color:rgba(233,220,192,.3); opacity:.45; text-shadow:none;}
  #legend .lrow.off:hover{opacity:.7;}
  #legend .lrow.off .ldot{background:#333!important; box-shadow:none; opacity:.35;}
  #legend .ldot{width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 6px currentColor; transition:all .25s;}

  /* 右侧详情（毛玻璃 80% 不透明 · 卡片内允许选中文字） */
  #detail{position:fixed; top:0; right:0; height:100%; width:380px; z-index:20;
    background:linear-gradient(205deg,
      rgba(38,28,18,.80) 0%,
      rgba(24,17,11,.80) 55%,
      rgba(18,13,9,.80) 100%);
    backdrop-filter:blur(22px) saturate(1.45) brightness(1.06);
    -webkit-backdrop-filter:blur(22px) saturate(1.45) brightness(1.06);
    border-left:1px solid rgba(201,162,39,.32);
    box-shadow:-12px 0 48px rgba(0,0,0,.42),
      inset 1px 0 0 rgba(255,248,235,.08),
      inset 0 1px 0 rgba(255,248,235,.05);
    transform:translateX(105%); transition:transform .35s ease;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:text; user-select:text;}
  #detail.open{transform:translateX(0);}
  #detail .detail-head{
    flex:0 0 auto; padding:26px 52px 12px 24px;
    border-bottom:1px solid rgba(201,166,107,.16);
    background:linear-gradient(180deg, rgba(255,248,235,.06), rgba(255,248,235,.02));}
  #detail .detail-scroll{
    flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:14px 18px 32px 24px; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:rgba(201,162,39,.42) transparent;
    scrollbar-gutter:stable;}
  #detail .detail-scroll::-webkit-scrollbar{width:6px;}
  #detail .detail-scroll::-webkit-scrollbar-track{
    margin:10px 0; background:rgba(201,162,39,.06); border-radius:3px;}
  #detail .detail-scroll::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg, rgba(201,162,39,.52), rgba(157,125,24,.38));
    border-radius:3px; border:1px solid rgba(201,162,39,.22);
    box-shadow:0 0 6px rgba(201,162,39,.18);}
  #detail .detail-scroll::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(180deg, rgba(201,162,39,.72), rgba(157,125,24,.55));}
  #detail .detail-scroll-wrap{flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column;}
  #detail .detail-scroll-wrap::before,
  #detail .detail-scroll-wrap::after{
    content:""; position:absolute; left:0; right:8px; height:18px; z-index:2; pointer-events:none;}
  #detail .detail-scroll-wrap::before{
    top:0; background:linear-gradient(180deg, rgba(18,13,9,.62), transparent);}
  #detail .detail-scroll-wrap::after{
    bottom:0; background:linear-gradient(0deg, rgba(18,13,9,.62), transparent);}
  #detail .close{position:absolute; top:14px; right:16px; cursor:pointer;
    color:var(--jin); font-size:22px; line-height:1; background:none; border:none;}
  #detail .tag{display:inline-block; font-size:11px; padding:3px 10px; border-radius:12px;
    color:#fff; margin-bottom:12px; letter-spacing:1px;}
  #detail h2{font-size:28px; color:var(--paper); margin-bottom:2px; font-family:var(--font-base); font-weight:700;
    text-shadow:0 0 12px rgba(201,162,39,.28); line-height:1.3;}
  /* 卡片英文标题：科技感无衬线 Rajdhani，加大字号与字距，与正文英文（Exo 2）区分 */
  #detail .en{font-size:16.5px; color:var(--jin); letter-spacing:1.1px; margin-bottom:14px; font-family:var(--font-entech); font-style:normal; font-weight:600; line-height:1.5;}
  /* ─── v5 中英文混排：中文 + 英文，适当换行 ─── */
  #detail .desc{font-size:15px; line-height:2.0; color:rgba(233,220,192,.95);}
  #detail .illus-wrap{margin:10px 0 4px; text-align:center;}
  #detail .illus-wrap img{
    max-width:100%; height:auto; display:inline-block;
    background:transparent;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.55)) drop-shadow(0 0 12px rgba(255,230,180,.35));
  }
  #detail .illus-wrap.photo img{
    max-width:78%;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,.45));
  }
  #detail .desc .cn-block{display:block; margin-bottom:10px; white-space:pre-wrap;}
  #detail .desc .cn-block p{margin:0 0 0.65em;}
  #detail .desc .cn-block p:last-child{margin-bottom:0;}
  #detail .desc .en-block{display:block; font-size:13.5px; line-height:1.85; color:rgba(127,179,196,.88); margin-top:10px; font-family:var(--font-en); letter-spacing:.2px; font-weight:400; font-style:normal; white-space:pre-wrap;}
  #detail .desc .en-block p{margin:0 0 0.7em;}
  #detail .desc .en-block p:last-child{margin-bottom:0;}
  /* 英文段首字母放大（小说式 drop cap） */
  #detail .desc .en-block > p:first-of-type::first-letter{
    float:left;
    font-size:3.05em;
    line-height:0.82;
    padding:0.06em 0.14em 0.02em 0;
    margin:0.04em 0.02em 0 0;
    font-weight:650;
    font-family:var(--font-entech), var(--font-en), Georgia, "Times New Roman", serif;
    color:rgba(201,166,107,.95);
    text-shadow:0 0 10px rgba(201,162,39,.28);
  }
  #detail .cul-notes{margin-top:10px; padding-top:8px; border-top:1px dashed rgba(201,166,107,.28);}
  #detail .cul-note{position:relative; padding:0 0 0 19px; margin-top:10px;
    font-size:12.5px; line-height:1.7; color:rgba(201,166,107,.92);
    font-family:var(--font-en); letter-spacing:.2px; white-space:normal;
    cursor:pointer; transition:color .18s;}
  #detail .cul-note:first-child{margin-top:0;}
  #detail .cul-note::before{content:"\2756"; position:absolute; left:2px; top:0;
    color:var(--jin); font-size:11px; font-style:normal; line-height:1.7;}
  #detail .cul-note:hover{color:rgba(233,220,192,.96);}
  #detail .cul-note.open{cursor:default; color:rgba(233,220,192,.98);}
  #detail .cul-note .cul-sum{font-weight:600; display:inline;}
  #detail .cul-note .cul-arr{display:inline-block; margin-left:5px;
    font-size:9px; color:rgba(201,162,39,.72); vertical-align:baseline;
    pointer-events:none; transition:transform .18s ease;}
  #detail .cul-note:not(.open) .cul-arr::before{content:"\25BE";}
  #detail .cul-note.open .cul-arr::before{content:"\25B4";}
  #detail .cul-note .cul-more{max-height:0; overflow:hidden; opacity:0;
    transition:max-height .38s ease, opacity .28s ease, margin .28s ease; margin-top:0;}
  #detail .cul-note.open .cul-more{max-height:520px; opacity:1; margin-top:6px; padding-top:0;}
  #detail .cul-note .cul-more-en{font-size:12px; line-height:1.75; color:rgba(201,166,107,.88); font-weight:400;}
  #detail .cul-note .cul-more-cn{margin-top:6px; font-size:13px; line-height:1.85;
    color:rgba(233,220,192,.94); font-family:var(--font-base); letter-spacing:.3px;}
  /* 英文中的文化类拼音：点状下划线，hover 浮出对应中文 */
  #detail .py-term{position:relative; cursor:help;
    text-decoration:underline dotted rgba(201,166,107,.85); text-underline-offset:3px; text-decoration-thickness:1px;}
  #detail .py-term::after{content:attr(data-cn); position:absolute; left:50%; bottom:calc(100% + 5px);
    transform:translateX(-50%) translateY(2px); opacity:0; pointer-events:none;
    background:rgba(20,14,9,.96); border:1px solid rgba(201,162,39,.55); color:var(--paper);
    font-family:var(--font-base); font-size:12.5px; font-style:normal; letter-spacing:1px;
    padding:3px 9px; border-radius:7px; white-space:nowrap; z-index:6;
    box-shadow:0 4px 14px rgba(0,0,0,.5); transition:opacity .16s ease, transform .16s ease;}
  #detail .py-term:hover::after{opacity:1; transform:translateX(-50%) translateY(0);}
  #detail .desc .spacer{display:none;}
  .detail-block{margin-top:14px; padding-top:12px; border-top:1px solid rgba(201,162,39,.2);}
  .detail-block h3{font-size:12px; color:var(--tian); letter-spacing:1.5px; margin-bottom:8px; font-weight:600;
    display:flex; align-items:center; gap:6px; font-family:var(--font-base);}
  .detail-block h3::before{content:""; width:3px; height:11px; background:var(--zhu);
    border-radius:2px; display:inline-block;}
  #detail ul.traits{list-style:none; margin:0; padding:0;}
  #detail ul.traits li{font-size:14px; line-height:1.7; color:rgba(233,220,192,.92);
    padding-left:16px; position:relative; margin-bottom:4px;}

  #detail .quote-block{border-left-color:rgba(201,162,39,.75); background:rgba(201,162,39,.06);}

  .rel-chips{display:flex; flex-wrap:wrap; gap:6px;}

  /* 图例“+10”飘字提示（类游戏金钱增减） */
  .float-tip{position:fixed; z-index:40; pointer-events:none; font-family:var(--font-entech);

    animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,0) scale(.8);}

    100%{opacity:0; transform:translate(-50%,-46px) scale(1);}

  /* 古建图例行：点与文字分工，hover 浮现 ± 步进器 */
  #legend .lrow .ldot{cursor:pointer;}
  #legend .lrow.heritage-row span:nth-child(2){cursor:pointer;}
  #legend .lrow.heritage-row span:nth-child(2):hover{text-shadow:0 0 8px rgba(201,162,39,.7);}

    opacity:0; transform:translateX(6px); transition:opacity .22s,transform .22s; pointer-events:none;}
  #legend .lrow.heritage-row:hover .hstep{opacity:1; transform:translateX(0); pointer-events:auto;}
  #legend .hstep button{width:16px; height:16px; border-radius:5px; padding:0; cursor:pointer;
    border:1px solid rgba(201,162,39,.5); background:rgba(201,162,39,.12); color:var(--jin);
    font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-entech); transition:all .2s;}
  #legend .hstep button:hover{background:rgba(201,162,39,.32); color:#fff; box-shadow:0 0 8px rgba(201,162,39,.5);}
  #legend .hstep .hnum{min-width:22px; text-align:center; font-size:10px;
    color:rgba(201,162,39,.9); font-family:var(--font-entech); letter-spacing:.5px;}
  /* 熄灭态下步进器仍可操作，保持可读 */
  #legend .lrow.heritage-row.off .hstep{opacity:0;}
  #legend .lrow.heritage-row.off:hover .hstep{opacity:.9;}

  /* 加载页：黑体笔画飞入拼装 → 得意黑 morph */
  #loading{position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    padding:24px 18px;
    background:radial-gradient(circle at 50% 40%, #1c1410 0%, #0f0b08 60%, #060403 100%);
    color:var(--jin); transition:opacity .65s ease, visibility .65s ease;}
  #loading.hide{opacity:0; visibility:hidden; pointer-events:none;}
  #loading .splash-stage{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;}
  #loading .splash-line{display:flex; align-items:center; justify-content:center; flex-wrap:nowrap;
    font-size:68px; font-weight:700; letter-spacing:6px; line-height:1.12; gap:0.06em;
    white-space:nowrap; max-width:100%;}
  #loading .splash-char{position:relative; display:inline-block; width:1.05em; height:1.05em; vertical-align:middle;}
  #loading .splash-char.splash-dot-char{width:.38em;}
  #loading .splash-morph-core{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transform:scaleX(1); transform-origin:center center; will-change:transform;}
  #loading .splash-strokes{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  #loading .splash-strokes g{will-change:transform; transition:transform .48s cubic-bezier(.16,1,.3,1);}
  #loading .splash-strokes path{fill:#E9DCC0;}
  #loading .splash-heiti,#loading .splash-smiley{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--paper); opacity:0; pointer-events:none;}
  #loading .splash-heiti{
    font-family:"Noto Sans SC","SimHei","Heiti SC","Microsoft YaHei",sans-serif;
    font-weight:700; letter-spacing:0;}
  #loading .splash-smiley{font-family:var(--font-smiley); font-weight:700;}
  #loading .splash-char.assembled .splash-strokes{opacity:0; transition:opacity .32s ease;}
  #loading .splash-char.assembled .splash-heiti{opacity:1; transition:opacity .28s ease;}
  #loading .splash-dot-char.assembled .splash-heiti{opacity:1;}
  #loading.splash-squeeze .splash-char.assembled .splash-morph-core{
    animation:splashSqueeze .48s cubic-bezier(.58,.02,.82,.45) forwards;}
  #loading.splash-bounce .splash-char.assembled .splash-heiti{opacity:0; transition:opacity .14s ease;}
  #loading.splash-bounce .splash-char.assembled .splash-smiley{
    opacity:1; text-shadow:0 0 22px rgba(201,162,39,.5), 0 0 36px rgba(201,162,39,.18);}
  #loading.splash-bounce .splash-char.assembled .splash-morph-core{
    animation:splashBounce .72s cubic-bezier(.18,1.45,.32,1) forwards;}
  @keyframes splashSqueeze{
    0%{transform:scaleX(1);}
    100%{transform:scaleX(0.07);}
  }
  @keyframes splashBounce{
    0%{transform:scaleX(0.07); opacity:.88;}
    42%{transform:scaleX(1.14); opacity:1;}
    68%{transform:scaleX(0.93);}
    100%{transform:scaleX(1); opacity:1;}

  #loading .splash-sub{display:block; font-family:var(--font-furion); font-size:16px; letter-spacing:2.5px;
    color:var(--jin); font-weight:600; font-style:italic; max-width:min(92vw,640px);
    opacity:0; transform:translateY(8px); transition:opacity .55s ease, transform .55s ease;}
  #loading .splash-sub.show{opacity:1; transform:none;}
  #loading .splash-body{display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; opacity:0; transform:translateY(8px);
    transition:opacity .55s ease .08s, transform .55s ease .08s;}
  #loading .splash-body.show{opacity:1; transform:none;}
  #loading .splash-hint{font-size:12px; letter-spacing:2.5px; color:rgba(201,162,39,.68);}
  #loading .splash-bar{width:min(200px, 40vw); height:2px; border-radius:2px;
    background:rgba(201,162,39,.16); overflow:hidden; position:relative;}
  #loading .splash-bar i{display:block; height:100%; width:40%; border-radius:2px;

  @keyframes splashScan{0%{transform:translateX(-120%);}100%{transform:translateX(340%);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 主界面：加载完成后淡入 */
  #topbar,#leftPanels,#search,#detail,#navHint,#zoomRail{opacity:0; transition:opacity .7s ease .15s; pointer-events:none;}

    body.app-ready.detail-open #leftPanels,

      opacity:0; pointer-events:none; visibility:hidden;

  /* 隐藏库自带纯文字导航 */
  .scene-nav-info{display:none!important;}

  /* 底部操纵提示：单色小行 */
  #navHint{

  #zoomRail input[type=range]{

  <script>
  (function(){
    var loading = document.getElementById("loading");
    var line = document.getElementById("splashLine");
    if (!line || !loading) return;
    window.splashAnimDone = false;

    var SEQ = [
      { c: "\u69ab" }, { c: "\u536f" }, { dot: true, c: "\u00b7" },
      { c: "\u6728" }, { c: "\u6784" }, { c: "\u5343" }, { c: "\u5e74" }
    ];
    var STROKE_MS = 420;
    var STROKE_GAP = 36;
    var ASSEMBLE_HOLD = 560;   /* 黑体拼合后多停一会，再开反转 */
    var SQUEEZE_MS = 480;
    var BOUNCE_MS = 720;
    var TAIL_MS = 640;         /* 得意黑落定后再多看一会儿 */
    var FONT_URL = "https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.0/files/noto-sans-sc-chinese-simplified-700-normal.woff";
    var GLYPH_SIZE = 860;
    var FLY = ["translateX(-118%)", "translateY(-118%)", "translateX(118%)", "translateY(118%)"];
    var _heitiFont = null;
    var _fontReady = null;

    function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
    function finishSplash(){
      var sub = document.querySelector("#loading .splash-sub");
      var body = document.querySelector("#loading .splash-body");
      if (sub) sub.classList.add("show");
      if (body) body.classList.add("show");
      window.splashAnimDone = true;
      if (typeof window._tryHideLoading === "function") window._tryHideLoading();
    }
    function preloadCssFonts(){
      if (!document.fonts || !document.fonts.load) return Promise.resolve();
      return Promise.all([
        document.fonts.load('700 68px "Noto Sans SC"'),
        document.fonts.load('700 68px "Smiley Sans"'),
        document.fonts.load('700 68px "Glow Sans SC"')
      ]).catch(function(){ return null; });
    }
    function loadHeitiFont(){
      if (_heitiFont) return Promise.resolve(_heitiFont);
      if (_fontReady) return _fontReady;
      if (!window.opentype) {
        _fontReady = Promise.reject(new Error("opentype"));
        return _fontReady;
      }
      _fontReady = Promise.race([
        new Promise(function(resolve, reject){
          opentype.load(FONT_URL, function(err, font){
            if (err) reject(err);
            else { _heitiFont = font; resolve(font); }
          });
        }),
        wait(5000).then(function(){ throw new Error("font-timeout"); })
      ]);
      return _fontReady;
    }
    /* 尽早并行预加载：opentype 黑体轮廓 + 页面字体 */
    var _bootPreload = Promise.all([
      loadHeitiFont().catch(function(){ return null; }),
      preloadCssFonts()
    ]);
    function cmdToSvgD(cmd, map){
      if (cmd.type === "M") return "M" + map(cmd.x, cmd.y);
      if (cmd.type === "L") return "L" + map(cmd.x, cmd.y);
      if (cmd.type === "C") return "C" + map(cmd.x1, cmd.y1) + " " + map(cmd.x2, cmd.y2) + " " + map(cmd.x, cmd.y);
      if (cmd.type === "Q") return "Q" + map(cmd.x1, cmd.y1) + " " + map(cmd.x, cmd.y);
      if (cmd.type === "Z") return "Z";
      return "";
    }
    function splitSubpaths(commands){
      var groups = [], cur = [];
      commands.forEach(function(cmd){
        if (cmd.type === "M" && cur.length){ groups.push(cur); cur = []; }
        cur.push(cmd);
      });
      if (cur.length) groups.push(cur);
      return groups;
    }
    function glyphParts(font, ch){
      var glyph = font.charToGlyph(ch);
      if (!glyph || glyph.index === 0) return [];
      var bbox = glyph.getBoundingBox();
      var raw = glyph.getPath(0, 0, GLYPH_SIZE).commands;
      var groups = splitSubpaths(raw);
      var w = Math.max(1, bbox.x2 - bbox.x1);
      var h = Math.max(1, bbox.y2 - bbox.y1);
      var scale = 860 / Math.max(w, h);
      var cx = (bbox.x1 + bbox.x2) / 2;
      var cy = (bbox.y1 + bbox.y2) / 2;
      function map(x, y){
        var nx = (x - cx) * scale + 512;
        var ny = 512 - (y - cy) * scale;
        return nx.toFixed(1) + " " + ny.toFixed(1);
      }
      return groups.map(function(gcmds){
        var d = gcmds.map(function(c){ return cmdToSvgD(c, map); }).join(" ");
        return d.replace(/\s+/g, " ").trim();
      }).filter(Boolean);
    }
    function makeCharShell(c, isDot){
      var wrap = document.createElement("span");
      wrap.className = "splash-char" + (isDot ? " splash-dot-char" : "");
      var core = document.createElement("span");
      core.className = "splash-morph-core";
      var heiti = document.createElement("span");
      heiti.className = "splash-heiti";
      heiti.textContent = c;
      var smiley = document.createElement("span");
      smiley.className = "splash-smiley";
      smiley.textContent = c;
      if (!isDot){
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "splash-strokes");
        svg.setAttribute("viewBox", "0 0 1024 1024");
        core.appendChild(svg);
      }
      core.appendChild(heiti);
      core.appendChild(smiley);
      wrap.appendChild(core);
      line.appendChild(wrap);
      return wrap;
    }
    function fillHeitiStrokes(wrap, parts){
      var svg = wrap.querySelector(".splash-strokes");
      if (!svg || !parts.length) return 0;
      parts.forEach(function(d, i){
        var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        g.appendChild(p);
        g.style.transform = FLY[i % FLY.length];
        svg.appendChild(g);
      });
      return parts.length;
    }
    function flyStrokes(wrap){
      var groups = wrap.querySelectorAll(".splash-strokes g");
      if (!groups.length) return Promise.resolve();
      var maxEnd = 0;
      groups.forEach(function(g, i){
        var delay = i * STROKE_GAP;
        maxEnd = Math.max(maxEnd, delay + STROKE_MS);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            setTimeout(function(){ g.style.transform = "none"; }, delay);
          });
        });
      });
      return wait(maxEnd);
    }
    function buildChar(item, font){
      var wrap = makeCharShell(item.c, !!item.dot);
      if (item.dot) return Promise.resolve({ wrap: wrap, strokes: 0 });
      var parts = font ? glyphParts(font, item.c) : [];
      return Promise.resolve({ wrap: wrap, strokes: fillHeitiStrokes(wrap, parts) });
    }
    function run(){
      /* 等字体/轮廓预加载完成再开飞入，避免首帧卡顿 */
      _bootPreload.then(function(res){
        var font = res && res[0];
        return Promise.all(SEQ.map(function(item){ return buildChar(item, font); }));
      }).then(function(built){
        /* 双 rAF：确保 DOM/样式已提交，再开 transform 过渡 */
        return new Promise(function(resolve){
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){ resolve(built); });
          });
        });
      }).then(function(built){
        var chars = built.filter(function(b){ return b.strokes > 0; });
        return Promise.all(chars.map(function(b){ return flyStrokes(b.wrap); })).then(function(){
          return built;
        });
      }).then(function(built){
        built.forEach(function(b){ b.wrap.classList.add("assembled"); });
        return wait(ASSEMBLE_HOLD);
      }).then(function(){
        loading.classList.add("splash-squeeze");
        return wait(SQUEEZE_MS);
      }).then(function(){
        loading.classList.remove("splash-squeeze");
        loading.classList.add("splash-bounce");
        return wait(BOUNCE_MS);
      }).then(function(){
        return wait(TAIL_MS);
      }).then(finishSplash).catch(finishSplash);
    }
    run();
  })();
  </script>

    var _sfxCtx = null;
    function sfxEnsure(){
      try {
        if (!_sfxCtx) _sfxCtx = new (window.AudioContext || window.webkitAudioContext)();

      } catch (_) {}

    }
    function sfxPlay(kind){
      var ctx = sfxEnsure();
      if (!ctx) return;
      var t = ctx.currentTime;
      var tick = kind === "tick";
      var peak = tick ? 0.042 : 0.068;
      var dur = tick ? 0.022 : 0.032;
      var f0 = tick ? 1520 : 1040;
      var f1 = tick ? 640 : 380;
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(90, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.0004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.01);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.012);
      if (!tick) {
        var len = Math.max(1, Math.ceil(ctx.sampleRate * 0.01));
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var ch = buf.getChannelData(0);
        for (var si = 0; si < len; si++) ch[si] = (Math.random() * 2 - 1) * (1 - si / len);
        var ns = ctx.createBufferSource();
        ns.buffer = buf;
        var ng = ctx.createGain();
        ng.gain.setValueAtTime(0.0001, t);
        ng.gain.linearRampToValueAtTime(0.038, t + 0.0003);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.014);
        ns.connect(ng);
        ng.connect(ctx.destination);
        ns.start(t);
      }
    }

      pick.slice(0, HERITAGE_INIT_LOAD).forEach(function(n){

    function linksAmong(ids){
      return DATA.links.filter(function(l){
        var s = (typeof l.source === "object") ? l.source.id : l.source;

        return ids[s] && ids[t];

    var coreLinks = linksAmong(loadedNodeIds);
    console.log("榫卯图谱：核心节点", coreNodes.length, "待载古建", heritageAll.length);

    function injectHeritageNodes(batch){
      if (!batch || !batch.length) return;
      if (perfMode) {
        var curN = heritageAll.filter(function(n){ return loadedNodeIds[n.id]; }).length;
        if (curN >= HERITAGE_PERF_MAX) {
          batch = batch.filter(function(n){ return loadedNodeIds[n.id]; });
        } else {
          var room = HERITAGE_PERF_MAX - curN;
          var add = batch.filter(function(n){ return !loadedNodeIds[n.id]; }).slice(0, room);
          batch = batch.filter(function(n){ return loadedNodeIds[n.id]; }).concat(add);
        }
        if (!batch.length) return;
      }
      batch.forEach(function(n){ loadedNodeIds[n.id] = true; });
      var g = Graph.graphData();
      var nodes = (g.nodes || []).slice();
      batch.forEach(function(n){
        if (!nodes.some(function(x){ return x.id === n.id; })) nodes.push(n);
      });
      if (chkState && chkState.heritage === false) {

        }

    function updateHeritageCount(){

    /* 飘字提示：类游戏金钱增减，从元素上方升起 */

    /* 点图例文字：一次点亮 10 个古建（按连接数从多到少） */
    function loadHeritageBatch(anchorEl){

        if (lr) lr.classList.remove("off");

    /* ─── 共享资源 ─── */
    function makeGlowTexture(){
      var c = document.createElement("canvas"); c.width = c.height = 128;
      var ctx = c.getContext("2d");
      var g = ctx.createRadialGradient(64,64,0,64,64,64);
      g.addColorStop(0,"rgba(255,255,255,1)");
      g.addColorStop(0.22,"rgba(255,255,255,0.55)");
      g.addColorStop(0.55,"rgba(255,255,255,0.16)");
      g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
      return new THREE.CanvasTexture(c);
    }
    var GLOW_TEX = makeGlowTexture();

    function makeGeometry(type){
      switch(type){
        case "mortise":      return new THREE.BoxGeometry(1, 1, 1); /* 实际由 makeMortiseLockGeometry 覆盖 */
        case "dynasty":      return new THREE.OctahedronGeometry(1, 0);
        case "region":       return new THREE.DodecahedronGeometry(1, 0);
        case "craft":        return new THREE.TetrahedronGeometry(1, 0);
        case "culture":      return new THREE.TorusKnotGeometry(0.6, 0.2, 80, 10);
        case "buildingType": return new THREE.CylinderGeometry(0.72, 0.72, 1.5, 20);
        case "literature":   return new THREE.BoxGeometry(1.5, 1.05, 0.36); /* 近现代默认；实际由 makeLiteratureGeometry 覆盖 */
        case "heritage":     return new THREE.SphereGeometry(1, 28, 20);
        default:             return new THREE.IcosahedronGeometry(1, 0);
      }
    }

    /**
     * 榫型节点：还原「几根木柱插在一起」的孔明锁/鲁班锁式六柱交插
     * 三轴各两根方柱，中心穿插咬合。
     */
    function makeMortiseLockGeometry(){
      var group = new THREE.Group();
      var len = 1.62, t = 0.30, o = 0.168;
      var bars = [
        /* X 向一对 */
        { sx: len, sy: t, sz: t, px: 0, py: o, pz: 0 },
        { sx: len, sy: t, sz: t, px: 0, py: -o, pz: 0 },
        /* Y 向一对 */
        { sx: t, sy: len, sz: t, px: 0, py: 0, pz: o },
        { sx: t, sy: len, sz: t, px: 0, py: 0, pz: -o },
        /* Z 向一对 */
        { sx: t, sy: t, sz: len, px: o, py: 0, pz: 0 },
        { sx: t, sy: t, sz: len, px: -o, py: 0, pz: 0 }
      ];
      bars.forEach(function(b){
        var geo = new THREE.BoxGeometry(b.sx, b.sy, b.sz);
        var mesh = new THREE.Mesh(geo);
        mesh.position.set(b.px, b.py, b.pz);
        group.add(mesh);
        /* 荧光白线描棱边 */
        var edges = new THREE.EdgesGeometry(geo, 20);
        var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
          color: 0xffffff, transparent: true, opacity: 0.85,
          depthWrite: false, blending: THREE.AdditiveBlending
        }));
        line.position.copy(mesh.position);
        line.userData.isEdgeGlow = true;
        group.add(line);
      });
      group.userData.mortiseForm = "luban";
      group.rotation.set(0.35, 0.55, 0.12);
      return group;
    }

    /* 省份：轮廓 Shape 挤出成有厚度的柱体（缓存几何） */
    var _provPrismCache = {};
    function makeProvincePrismGeometry(node){
      var key = node.id || node.name;
      if (_provPrismCache[key]) return _provPrismCache[key].clone();
      var outlines = window.PROVINCE_OUTLINES || {};
      var pts = outlines[key];
      if (!pts || pts.length < 3) {
        return makeGeometry("region");
      }
      var shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      var geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.108,
        bevelEnabled: true,
        bevelThickness: 0.014,
        bevelSize: 0.011,
        bevelSegments: 1,
        curveSegments: 1
      });
      geo.center();
      /* 略倾，让轮廓面更易辨认 */
      geo.rotateX(-Math.PI * 0.18);
      _provPrismCache[key] = geo;
      return geo.clone();
    }

    /* 典籍形态分期：按书籍本身所属历史时期（成书/刊行），不用“挂接朝代取最早” */
    var DYNASTY_ERA = {
      hemudu: 0, chunqiu: 0, han: 0, tang: 0, song: 0, yuan: 0, liao: 0, jin: 0,
      ming: 1, qing: 1,
      modern: 2
    };
    /* 表示“此书成于/颁于该朝”的关系；研究、文献年代、比喻等只是话题挂接，不决定书形 */
    var BOOK_PERIOD_REL = {
      "颁于": 1, "载于": 1, "成书/传抄年代": 1, "成于": 1, "著于": 1, "刊于": 1, "撰于": 1, "辑于": 1
    };
    function inferEraFromBookText(node){
      var name = node.name || "";
      var blob = name + "\n" + (node.desc || "") + "\n" + (node.detail || "") + "\n" + (node.enDesc || "") + "\n" + (node.enDetail || "");
      /* 1) 近现代著作优先（避免《明式家具研究》因“明”被判成线装） */
      if (/民国|现代|近现代|王世襄|译本|学堂|制造局|圣经|新旧约|二十世纪|\b19\d{2}\b|\b20\d{2}\b/.test(blob)) return 2;
      if (/研究》/.test(name) || /研究$/.test(name.replace(/[》\s]+$/g, ""))) return 2;
      /* 2) 正文里明确的成书/刊行朝代 */
      if (/北宋|南宋|宋代|宋朝|唐朝|唐代|汉朝|汉代|春秋|战国|先秦|元代|元朝|辽代|金代|河姆渡/.test(blob)) return 0;
      if (/明代|明朝|明末|清代|清朝|清初|清工部|工部颁/.test(blob)) return 1;
      /* 3) 书名启发式 */
      if (/楚辞|考工|周礼|营造法式|梦溪|武经/.test(name)) return 0;
      if (/则例|天工开物|鲁班经|园冶/.test(name)) return 1;
      return null;
    }
    function literatureBookForm(node){
      if (node.__bookForm) return node.__bookForm;
      var era = inferEraFromBookText(node);
      if (era == null) {
        /* 仅采纳“成书/颁行”类朝代边；多条时取众数，不再取最早分期 */
        var votes = [0, 0, 0];
        var any = false;
        (DATA.links || []).forEach(function(l){
          var s = (typeof l.source === "object") ? l.source.id : l.source;
          var t = (typeof l.target === "object") ? l.target.id : l.target;
          if (s !== node.id && t !== node.id) return;
          var other = (s === node.id) ? t : s;
          var dn = nodeById(other);
          if (!dn || dn.type !== "dynasty") return;
          var rel = l.relation || "";
          if (!BOOK_PERIOD_REL[rel]) return;
          var e = DYNASTY_ERA[dn.id];
          if (e == null) return;
          votes[e]++; any = true;
        });
        if (any) {
          era = 0;
          if (votes[1] > votes[era]) era = 1;
          if (votes[2] > votes[era]) era = 2;
        }
      }
      if (era == null) {
        var blob = (node.name || "") + (node.desc || "") + (node.detail || "");
        if (/现代|民国|译本|研究|学堂|制造局|圣经|新旧约/.test(blob)) era = 2;
        else if (/明|清|则例|营造|家具/.test(blob)) era = 1;
        else era = 0;
      }
      node.__bookForm = era === 0 ? "scroll" : (era === 1 ? "xianzhuang" : "paperback");
      return node.__bookForm;
    }

    /** 贝塞尔拱起的纸面实体（有厚度，正反面与侧边均可绘） */
    function makeBezierPaperGeo(width, height, amp, segsX, segsY, thickness){
      segsX = segsX || 28;
      segsY = segsY || 10;
      thickness = thickness == null ? 0.045 : thickness;
      var hw = width * 0.5, hh = height * 0.5;
      var nx = segsX + 1, ny = segsY + 1;
      var positions = [];
      var indices = [];
      function zAt(x){
        var t = (x / hw + 1) * 0.5;
        return 4 * t * (1 - t) * amp;
      }
      function pushGrid(zOff){
        for (var iy = 0; iy < ny; iy++){
          for (var ix = 0; ix < nx; ix++){
            var x = -hw + (ix / segsX) * width;
            var y = -hh + (iy / segsY) * height;
            positions.push(x, y, zAt(x) + zOff);
          }
        }
      }
      pushGrid(0);            /* 正面 */
      pushGrid(-thickness);   /* 背面 */
      function vid(layer, ix, iy){ return layer * nx * ny + iy * nx + ix; }
      var ix, iy, a, b, c, d;
      for (iy = 0; iy < segsY; iy++){
        for (ix = 0; ix < segsX; ix++){
          a = vid(0, ix, iy); b = vid(0, ix + 1, iy); c = vid(0, ix + 1, iy + 1); d = vid(0, ix, iy + 1);
          indices.push(a, b, c, a, c, d);
          a = vid(1, ix, iy); b = vid(1, ix + 1, iy); c = vid(1, ix + 1, iy + 1); d = vid(1, ix, iy + 1);
          indices.push(a, c, b, a, d, c); /* 背面反向卷绕 */
        }
      }
      /* 左右侧边 */
      for (iy = 0; iy < segsY; iy++){
        a = vid(0, 0, iy); b = vid(0, 0, iy + 1); c = vid(1, 0, iy + 1); d = vid(1, 0, iy);
        indices.push(a, d, c, a, c, b);
        a = vid(0, segsX, iy); b = vid(0, segsX, iy + 1); c = vid(1, segsX, iy + 1); d = vid(1, segsX, iy);
        indices.push(a, b, c, a, c, d);
      }
      /* 上下侧边 */
      for (ix = 0; ix < segsX; ix++){
        a = vid(0, ix, 0); b = vid(0, ix + 1, 0); c = vid(1, ix + 1, 0); d = vid(1, ix, 0);
        indices.push(a, b, c, a, c, d);
        a = vid(0, ix, segsY); b = vid(0, ix + 1, segsY); c = vid(1, ix + 1, segsY); d = vid(1, ix, segsY);
        indices.push(a, d, c, a, c, b);
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    /** 明前：改良卷轴（有厚度的拱起纸面） */
    function makeScrollGeometry(){
      var group = new THREE.Group();
      var paper = new THREE.Mesh(makeBezierPaperGeo(1.08, 1.0, 0.14, 28, 10, 0.05));
      paper.position.set(0, 0, 0.02);
      group.add(paper);
      var rollerGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.18, 14);
      var left = new THREE.Mesh(rollerGeo);
      left.position.set(-0.60, 0, 0.02);
      group.add(left);
      var right = new THREE.Mesh(rollerGeo);
      right.position.set(0.60, 0, 0.02);
      group.add(right);
      var knobGeo = new THREE.SphereGeometry(0.18, 10, 8);
      [[-0.60, 0.64], [-0.60, -0.64], [0.60, 0.64], [0.60, -0.64]].forEach(function(p){
        var k = new THREE.Mesh(knobGeo);
        k.position.set(p[0], p[1], 0.02);
        k.scale.set(1, 0.7, 1);
        group.add(k);
      });
      var curlGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.96, 12, 1, false, -Math.PI * 0.5, Math.PI);
      var curlL = new THREE.Mesh(curlGeo);
      curlL.position.set(-0.48, 0, 0.06);
      group.add(curlL);
      var curlR = new THREE.Mesh(curlGeo);
      curlR.position.set(0.48, 0, 0.06);
      curlR.rotation.y = Math.PI;
      group.add(curlR);
      group.userData.bookForm = "scroll";
      return group;
    }

    /** 明清：线装书 —— 薄册 + 右侧四眼线钉 + 左侧题签（参照实物） */
    function makeXianzhuangGeometry(){
      var group = new THREE.Group();
      /* 竖长薄册：宽:高 ≈ 3:4，厚度约宽的 7% */
      var W = 1.05, H = 1.40, D = 0.078;
      var body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D));
      group.add(body);
      /* 纸口微露（切边，略浅） */
      var pageMat = new THREE.MeshStandardMaterial({
        color: 0xE8DCC4, emissive: 0x3a3428, emissiveIntensity: 0.15,
        metalness: 0.05, roughness: 0.85, transparent: true, opacity: 0.95
      });
      var pages = new THREE.Mesh(new THREE.BoxGeometry(W * 0.97, H * 0.97, D * 0.72), pageMat);
      pages.position.set(-0.01, 0, 0);
      pages.userData.fixedMat = true;
      group.add(pages);
      /* 左侧题签（竖长米色签条） */
      var labelMat = new THREE.MeshStandardMaterial({
        color: 0xF3EBDA, emissive: 0x4a4030, emissiveIntensity: 0.12,
        metalness: 0.02, roughness: 0.9, transparent: true, opacity: 0.98
      });
      var labelW = W * 0.20, labelH = H * 0.72, labelD = 0.012;
      var label = new THREE.Mesh(new THREE.BoxGeometry(labelW, labelH, labelD), labelMat);
      label.position.set(-W * 0.28, 0.02, D * 0.5 + labelD * 0.5);
      label.userData.fixedMat = true;
      group.add(label);
      /* 题签细边框感：略内缩的淡墨条（装饰） */
      var ruleMat = new THREE.MeshBasicMaterial({
        color: 0x5C4A32, transparent: true, opacity: 0.35
      });
      var rule = new THREE.Mesh(new THREE.BoxGeometry(labelW * 0.12, labelH * 0.82, 0.006), ruleMat);
      rule.position.set(label.position.x - labelW * 0.28, label.position.y, label.position.z + 0.004);
      rule.userData.fixedMat = true;
      group.add(rule);
      /* 右侧四眼线装：正面 + 背面均可见线迹 */
      var threadMat = new THREE.MeshStandardMaterial({
        color: 0xF7F4EE, emissive: 0x888888, emissiveIntensity: 0.25,
        metalness: 0.05, roughness: 0.55, transparent: true, opacity: 0.98
      });
      var stitchX = W * 0.5 - 0.045;
      var stitchInset = 0.095;
      var zFront = D * 0.5 + 0.008;
      var zBack = -D * 0.5 - 0.008;
      /* 封面竖线 */
      var vFront = new THREE.Mesh(new THREE.BoxGeometry(0.018, H * 0.78, 0.014), threadMat);
      vFront.position.set(stitchX - stitchInset * 0.55, 0, zFront);
      vFront.userData.fixedMat = true;
      group.add(vFront);
      /* 封底竖线 */
      var vBack = new THREE.Mesh(new THREE.BoxGeometry(0.018, H * 0.78, 0.014), threadMat.clone());
      vBack.position.set(stitchX - stitchInset * 0.55, 0, zBack);
      vBack.userData.fixedMat = true;
      group.add(vBack);
      var ys = [-0.42, -0.14, 0.14, 0.42].map(function(t){ return t * H * 0.72; });
      ys.forEach(function(y){
        /* 封面横缠线 */
        var hFront = new THREE.Mesh(new THREE.BoxGeometry(stitchInset, 0.016, 0.012), threadMat.clone());
        hFront.position.set(stitchX - stitchInset * 0.5, y, zFront);
        hFront.userData.fixedMat = true;
        group.add(hFront);

    /* ─── 古建：亭 / 楼 / 阁 / 庙 / 塔（程序化低模） ─── */
    function heritageArchForm(node){
      if (node.__archForm) return node.__archForm;
      var blob = (node.name || "") + "\n" + (node.desc || "") + "\n" + (node.detail || "");
      var form = "miao";
      if (/塔|宝塔|花塔|经幢/.test(blob)) form = "ta";
      else if (/亭|轩|榭/.test(blob)) form = "ting";
      else if (/阁/.test(blob)) form = "ge";
      else if (/楼|城楼|鼓楼|钟楼|碉楼|土楼/.test(blob)) form = "lou";
      else if (/庙|寺|庵|祠|观|殿|坛|宫|清真寺|召/.test(blob)) form = "miao";

    var _up = new THREE.Vector3(0, 1, 0);

      var coreDist = Math.max(dist - sR - tR, 0.001);
      var sCenter = _a.clone().addScaledVector(_dir, sR);

      startEnd.start = { x: sCenter.x, y: sCenter.y, z: sCenter.z };
      startEnd.end   = { x: eCenter.x, y: eCenter.y, z: eCenter.z };
      _mid.copy(sCenter).add(eCenter).multiplyScalar(0.5);

    function applyForceParams(){
      try {
        Graph.d3Force("charge").strength(forceCharge);
        Graph.d3Force("link").distance(forceLinkDist).strength(forceLinkStr);
        var cf = Graph.d3Force("center");
        if (cf && cf.strength) cf.strength(forceCenter);
        var BN = 230;
        Graph.d3Force("bound", function(){
          DATA.nodes.forEach(function(n){
            var dx=n.x, dy=n.y, dz=n.z;
            var d = Math.sqrt(dx*dx+dy*dy+dz*dz);
            if (d > BN){ var k=(d-BN)*0.05; n.vx-=dx/d*k; n.vy-=dy/d*k; n.vz-=dz/d*k; }
          });
        });
        // 节点斥力：近距碰撞分离力（空间哈希，防节点重叠）
        Graph.d3Force("collide", function(alpha){
          if (forceRepulse <= 0.005) return;
          var ns = Graph.graphData().nodes || [];
          if (!ns.length) return;
          /* 斥力 >1 时同步扩大碰撞半径：不只推得更硬，还隔得更开 */
          var rMul = forceRepulse > 1 ? 1 + (forceRepulse - 1) * 0.45 : 1;
          function radOf(n){
            return (Math.cbrt((TYPE_SIZE[n.type] || 4) * forceNodeMul) * 4 + 2) * rMul;
          }
          /* 网格边长随最大碰撞半径伸缩，避免高斥力时漏检邻格 */
          var cell = Math.max(30, radOf({ type: "heritage" }) * 2.2);
          var grid = {}, i, n, key;
          for (i = 0; i < ns.length; i++){
            n = ns[i];
            if (n.x == null) continue;
            key = Math.floor(n.x/cell) + "," + Math.floor(n.y/cell) + "," + Math.floor(n.z/cell);
            (grid[key] || (grid[key] = [])).push(n);
          }
          var k = forceRepulse * alpha * 1.2;
          for (i = 0; i < ns.length; i++){
            n = ns[i];
            if (n.x == null) continue;
            var rA = radOf(n);
            var cx = Math.floor(n.x/cell), cy = Math.floor(n.y/cell), cz = Math.floor(n.z/cell);
            for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) for (var oz = -1; oz <= 1; oz++){
              var bucket = grid[(cx+ox) + "," + (cy+oy) + "," + (cz+oz)];
              if (!bucket) continue;
              for (var j = 0; j < bucket.length; j++){
                var m = bucket[j];
                if (m === n) continue;
                /* index 可能尚未赋值：回退用 id，避免漏推或双倍推力 */
                if (n.index != null && m.index != null) {
                  if (m.index <= n.index) continue;
                } else if (String(m.id) <= String(n.id)) {
                  continue;
                }
                var dx = n.x - m.x, dy = n.y - m.y, dz = n.z - m.z;
                var d2 = dx*dx + dy*dy + dz*dz;
                var r = rA + radOf(m);
                if (d2 >= r*r || d2 < 1e-6) continue;
                var d = Math.sqrt(d2);
                var push = (r - d) / d * k * 0.5;
                dx *= push; dy *= push; dz *= push;
                n.vx += dx; n.vy += dy; n.vz += dz;
                m.vx -= dx; m.vy -= dy; m.vz -= dz;
              }
            }
          }
        });
      } catch(e){}
    }

    function updateSceneFog() {
      if (!scene) return;
      /* 雾距随立体度收紧，覆盖外围粒子壳层 */
      var near = 280 - forceDepth * 200; // 280 → 80
      var far  = 900 - forceDepth * 520; // 900 → 380
      if (!scene.fog) {
        scene.fog = new THREE.Fog(new THREE.Color(0x0a0806), near, far);
      } else {

    /* 立体度：更陡的近远阶梯，拉开层次（最低档仍可读，但不抬得过高） */
    var NODE_MIN_ATTEN = 0.10;
    var NODE_MIN_OPACITY = 0.18;
    var NODE_MIN_EMISSIVE = 0.12;
    var NODE_MIN_HALO = 0.06;
    var LINK_MIN_OPACITY = 0.05;
    var LABEL_MIN_OPACITY = 0.08;

    /* 点云中心/半径缓存（动画循环每帧更新），衰减按点云前后沿归一化 */
    var _cloudC = { x: 0, y: 0, z: 0 };
    var _cloudR = 200;
    function getDepthAttenuation(worldX, worldY, worldZ, camPos) {
      if (forceDepth < 0.01) return 1.0;
      var dx = worldX - camPos.x;
      var dy = worldY - camPos.y;
      var dz = worldZ - camPos.z;
      var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      /* 相对归一化：以“相机到点云前沿/后沿”为 0→1，缩得再远前后排也拉开档次 */
      var cx = _cloudC.x - camPos.x, cy = _cloudC.y - camPos.y, cz = _cloudC.z - camPos.z;
      var camToC = Math.sqrt(cx*cx + cy*cy + cz*cz);
      var span = Math.max(60, _cloudR * 2);
      var tNorm = (dist - (camToC - _cloudR)) / span;
      tNorm = Math.min(1, Math.max(0, tNorm));
      var steep = 0.55 + forceDepth * 2.4;
      var atten = Math.exp(-steep * tNorm * tNorm);
      /* 量化成更明显的层次带 */
      var bands = 6 + Math.round(forceDepth * 6);
      atten = Math.round(atten * bands) / bands;
      return Math.max(NODE_MIN_ATTEN, atten);
    }

    /* ============================================================
     * 光环系统 v3：三层艺术光环 + 轨道角度差 + 文字立体旋转

    var haloSystem = null;

    /* LED 环带贴图：一行文字铺满画布，环绕圆柱面重复；带扫描线质感 */
    function makeBandTexture(texts, colorHex){
      var W = 4096, H = 128;
      var c = document.createElement("canvas");
      c.width = W; c.height = H;
      var ctx = c.getContext("2d");
      ctx.clearRect(0, 0, W, H);
      /* LED 扫描线 */
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      for (var y = 2; y < H; y += 6) ctx.fillRect(0, y, W, 1);
      /* 酸性/几何字体：中文 HarmonyOS Sans SC，英文 Avant Garde 系（Questrial/Poppins 兜底），紧字距 */
      ctx.font = '700 82px "HarmonyOS Sans SC","ITC Avant Garde Gothic Std","Questrial","Poppins","Glow Sans SC","Noto Sans SC",sans-serif';
      try { ctx.letterSpacing = "1px"; } catch (e) {}
      ctx.textBaseline = "middle";
      ctx.fillStyle = colorHex || "#C9A227";
      ctx.shadowColor = colorHex || "#C9A227";
      ctx.shadowBlur = 16;
      var joined = texts.join("　·　") + "　·　";
      var w = Math.max(1, ctx.measureText(joined).width);
      for (var x = 0; x < W + w; x += w) ctx.fillText(joined, x, H / 2 + 2);
      var tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    function createParticleRing(R, count, colorHex, opacity, size) {
      var pos = new Float32Array(count * 3);
      var col = new Float32Array(count * 3);
      var color = new THREE.Color(colorHex);
      for (var i = 0; i < count; i++) {
        var angle = (i / count) * Math.PI * 2;
        pos[i*3]   = R * Math.cos(angle);
        pos[i*3+1] = 0;
        pos[i*3+2] = R * Math.sin(angle);
        var b = 0.6 + Math.random() * 0.4;
        col[i*3] = color.r * b;
        col[i*3+1] = color.g * b;
        col[i*3+2] = color.b * b;
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("color", new THREE.BufferAttribute(col, 3));
      var m = new THREE.PointsMaterial({ size: size || 3.5, sizeAttenuation: true,
        vertexColors: true, transparent: true, opacity: opacity || 0.7,
        blending: THREE.AdditiveBlending, depthWrite: false });
      var pts = new THREE.Points(g, m);
      pts.renderOrder = -5;
      return pts;
    }

    function createHaloLayer(R, particles, textArray, colorHex, opacity, spriteSize) {
      var group = new THREE.Group();

      // 粒子环
      var ring = createParticleRing(R, particles, colorHex, opacity, 3.2);
      ring.name = "ring";
      group.add(ring);

      // LED 环带：文字贴附于圆柱曲面（有正反面），随环转动 + 走马灯滚动
      var bandH = Math.max(14, Math.round((spriteSize || 110) * 0.16));
      var colorCss = "#" + new THREE.Color(colorHex).getHexString();
      var bandTex = makeBandTexture(textArray, colorCss);
      /* 让贴图在圆周上整数次重复，避免接缝错位；单元世界宽度 = 带高 × 画布宽高比(32) */
      var reps = Math.max(1, Math.round((2 * Math.PI * R) / (bandH * 32)));
      bandTex.repeat.set(reps, 1);
      var bandGeo = new THREE.CylinderGeometry(R, R, bandH, 160, 1, true);
      var bandMat = new THREE.MeshBasicMaterial({
        map: bandTex, transparent: true, opacity: 0.5,
        side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false
      });
      var band = new THREE.Mesh(bandGeo, bandMat);
      band.renderOrder = -4;
      band.name = "band";
      band.userData = { scroll: 0.008 + Math.random() * 0.010, baseOp: 0.5,
        texts: textArray, colorCss: colorCss, reps: reps };
      band.raycast = function(){};
      group.add(band);

      // 细环线
      var curveGeom = new THREE.BufferGeometry();
      var segs = 200;
      var curvePts = new Float32Array((segs + 1) * 3);
      for (var j = 0; j <= segs; j++) {
        var a = (j / segs) * Math.PI * 2;
        curvePts[j*3] = R * Math.cos(a);
        curvePts[j*3+1] = 0;
        curvePts[j*3+2] = R * Math.sin(a);
      }
      curveGeom.setAttribute("position", new THREE.BufferAttribute(curvePts, 3));
      var curveLine = new THREE.Line(curveGeom, new THREE.LineBasicMaterial({
        color: new THREE.Color(colorHex), transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      curveLine.renderOrder = -6;
      curveLine.name = "curve";
      group.add(curveLine);

      group.raycast = function(){};
      return group;
    }

    // 天球 + 经纬网
    var sky = null, grat = null, SKY_R = 300;
    try {
      if (scene) {
        sky = new THREE.Mesh(
          new THREE.SphereGeometry(SKY_R, 48, 32),
          new THREE.MeshBasicMaterial({ color:0x7FB3C4, transparent:true, opacity:0.06,
            side:THREE.BackSide, depthWrite:false })
        );
        sky.renderOrder = -10; sky.raycast = function(){};
        scene.add(sky);

        function makeGraticule(R, latN, lonN){
          var pts = [];
          var ld = Math.PI*2/lonN;
          for (var i=0;i<lonN;i++){
            var lon = i*ld;
            for (var j=0;j<64;j++){
              var a=j/64*Math.PI*2, b=(j+1)/64*Math.PI*2;
              pts.push(R*Math.cos(a)*Math.cos(lon), R*Math.sin(a), R*Math.cos(a)*Math.sin(lon));
              pts.push(R*Math.cos(b)*Math.cos(lon), R*Math.sin(b), R*Math.cos(b)*Math.sin(lon));
            }
          }
          for (var k=0;k<latN;k++){
            var lat = -Math.PI/2 + (k+1)/(latN+1)*Math.PI;
            var rr = R*Math.cos(lat), y = R*Math.sin(lat);
            for (var m=0;m<64;m++){
              var c=m/64*Math.PI*2, e=(m+1)/64*Math.PI*2;
              pts.push(rr*Math.cos(c), y, rr*Math.sin(c));
              pts.push(rr*Math.cos(e), y, rr*Math.sin(e));
            }
          }
          var g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
          return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
            color:0x7FB3C4, transparent:true, opacity:0.05,
            blending:THREE.AdditiveBlending, depthWrite:false
          }));

    // v6: 旧星云场已替换为 buildBackgroundStars + buildBackgroundNets

    /* ─── 梁思成手稿星座 v2：线描骨架 + 差异化星等 + 各自闪烁 + 节外生枝卫星星
     * 组整体跟随相机位置（只随方向变化、无视差），是纯粹的遥远背景 ─── */
    var liangSky = null, liangFigs = [];
    var LIANG_STAR_SHADER = {
      vertex: [
        "attribute float size; attribute float alpha; attribute vec3 col;",
        "varying float vA; varying vec3 vC;",
        "void main(){",
        "  vC = col; vA = alpha;",
        "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
        "  gl_PointSize = size * (2600.0 / max(400.0, -mv.z));",
        "  gl_Position = projectionMatrix * mv;",
        "}"].join("\n"),
      fragment: [
        "uniform sampler2D tex; varying float vA; varying vec3 vC;",
        "void main(){",
        "  vec4 t = texture2D(tex, gl_PointCoord);",
        "  gl_FragColor = vec4(vC, vA) * t;",
        "}"].join("\n")
    };
    function buildLiangConstellations(){
      if (!scene || liangSky || !window.LIANG_CONSTELLATIONS) return;
      liangSky = new THREE.Group();
      liangSky.raycast = function(){};
      var figs = window.LIANG_CONSTELLATIONS;
      /* 远远的天幕壳层：固定世界坐标，不跟相机跑，只作背景 */
      var R = 3200;
      figs.forEach(function(f, k){
        var g = new THREE.Group();
        var az = (k / figs.length) * Math.PI * 2 + 0.28;
        var el = [-0.18, 0.12, -0.32, 0.26, -0.08, 0.36, -0.24, 0.18, -0.40, 0.30, -0.14, 0.22, -0.36, 0.08, 0.42, -0.28][k % 16];
        var n = f.stars.length;
        /* 远距仍要占视野：图幅放大；星少的单体也保底够大 */
        var W = Math.min(2200, 780 + 38 * Math.sqrt(Math.max(n, 20)));
        var H = W / Math.max(0.35, f.ar);
        /* 节外生枝：少量游离卫星星，强化星座感而非点阵感 */
        var satN = Math.max(2, Math.round(n * 0.06));
        var total = n + satN;
        var pos   = new Float32Array(total * 3);
        var col   = new Float32Array(total * 3);
        var size  = new Float32Array(total);
        var alpha = new Float32Array(total);
        var baseA = new Float32Array(total);
        var spd   = new Float32Array(total);
        var phase = new Float32Array(total);
        function paint(i, bright){
          var r = Math.random();
          var cr, cg, cb;
          if (r < 0.55)      { cr = 1.0;  cg = 0.88; cb = 0.62; }   /* 暖金 */
          else if (r < 0.82) { cr = 1.0;  cg = 0.97; cb = 0.90; }   /* 月白 */
          else               { cr = 0.72; cg = 0.84; cb = 1.0;  }   /* 淡蓝 */
          var lum = (0.72 + Math.random() * 0.38) * (bright ? 1.2 : 1);
          col[i*3] = cr * lum; col[i*3+1] = cg * lum; col[i*3+2] = cb * lum;
          /* 远景星点：屏幕像素尺度稍大；多数暗小、少数亮大 */
          size[i]  = bright ? (14 + Math.random() * 10) : (5 + 14 * Math.pow(Math.random(), 2.4));
          baseA[i] = bright ? 0.95 : 0.42 + Math.random() * 0.45;
          alpha[i] = baseA[i];
          spd[i]   = 0.08 + Math.random() * 0.32;
          phase[i] = Math.random() * Math.PI * 2;
        }
        for (var i = 0; i < n; i++){
          pos[i*3]   = (f.stars[i][0] - 0.5) * W;
          pos[i*3+1] = (0.5 - f.stars[i][1]) * H;
          pos[i*3+2] = (Math.random() - 0.5) * 14;
          paint(i, Math.random() < 0.12);
        }
        var sats = [];
        for (var s = 0; s < satN; s++){
          var i2 = n + s;
          var anchor = Math.floor(Math.random() * n);
          var ang = Math.random() * Math.PI * 2;
          var dist = W * (0.06 + Math.random() * 0.12);
          var ax = pos[anchor*3], ay = pos[anchor*3+1], az2 = pos[anchor*3+2];
          pos[i2*3]   = ax + Math.cos(ang) * dist;
          pos[i2*3+1] = ay + Math.sin(ang) * dist;
          pos[i2*3+2] = az2;
          paint(i2, Math.random() < 0.45);
          sats.push({ idx: i2, anchor: anchor,
            ox: Math.cos(ang) * dist, oy: Math.sin(ang) * dist,
            amp: W * (0.014 + Math.random() * 0.022),
            sp: 0.04 + Math.random() * 0.08, ph: Math.random() * Math.PI * 2 });
        }
        var geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("col",   new THREE.BufferAttribute(col, 3));
        geo.setAttribute("size",  new THREE.BufferAttribute(size, 1));
        geo.setAttribute("alpha", new THREE.BufferAttribute(alpha, 1));
        var mat = new THREE.ShaderMaterial({
          uniforms: { tex: { value: GLOW_TEX } },
          vertexShader: LIANG_STAR_SHADER.vertex,
          fragmentShader: LIANG_STAR_SHADER.fragment,
          transparent: true, blending: THREE.AdditiveBlending,
          depthWrite: false, fog: false
        });
        var pts = new THREE.Points(geo, mat);
        pts.renderOrder = -30;
        g.add(pts);
        /* 线描主骨：比星点更抢眼，强化星座连线感 */
        var lp = new Float32Array(f.links.length * 6);
        for (var li = 0; li < f.links.length; li++){
          var a = f.links[li][0], b = f.links[li][1];
          lp[li*6]   = pos[a*3];   lp[li*6+1] = pos[a*3+1]; lp[li*6+2] = pos[a*3+2];
          lp[li*6+3] = pos[b*3];   lp[li*6+4] = pos[b*3+1]; lp[li*6+5] = pos[b*3+2];
        }
        var lgeo = new THREE.BufferGeometry();
        lgeo.setAttribute("position", new THREE.BufferAttribute(lp, 3));
        var lines = new THREE.LineSegments(lgeo, new THREE.LineBasicMaterial({
          color: 0xD4B06A, transparent: true, opacity: 0.22,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        lines.renderOrder = -31;
        g.add(lines);
        var bp = new Float32Array(satN * 6);
        for (var s2 = 0; s2 < satN; s2++){
          var sat = sats[s2];
          bp[s2*6]   = pos[sat.anchor*3]; bp[s2*6+1] = pos[sat.anchor*3+1]; bp[s2*6+2] = pos[sat.anchor*3+2];
          bp[s2*6+3] = pos[sat.idx*3];    bp[s2*6+4] = pos[sat.idx*3+1];    bp[s2*6+5] = pos[sat.idx*3+2];
        }
        var bgeo = new THREE.BufferGeometry();
        bgeo.setAttribute("position", new THREE.BufferAttribute(bp, 3));
        var branch = new THREE.LineSegments(bgeo, new THREE.LineBasicMaterial({
          color: 0xE0C27A, transparent: true, opacity: 0.18,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        branch.renderOrder = -31;
        g.add(branch);
        g.position.set(R * Math.cos(el) * Math.cos(az), R * Math.sin(el), R * Math.cos(el) * Math.sin(az));
        g.lookAt(0, 0, 0);
        g.raycast = function(){};
        liangSky.add(g);
        liangFigs.push({ pts: pts, sats: sats, branch: branch, lines: lines,
          baseA: baseA, spd: spd, phase: phase, count: total });
      });
      scene.add(liangSky);
    }

    /* ─── 著名天文星座：冷色、稀疏经典连线，与手稿星座错开天区 ─── */
    var astroSky = null, astroFigs = [];
    function buildAstroConstellations(){
      if (!scene || astroSky || !window.ASTRO_CONSTELLATIONS) return;
      astroSky = new THREE.Group();
      astroSky.raycast = function(){};
      var figs = window.ASTRO_CONSTELLATIONS;
      var R = 3800; /* 比手稿星座更远一层 */
      figs.forEach(function(f, k){
        var g = new THREE.Group();
        /* 与梁氏星座错开方位，避免叠在同一片天区 */
        var az = (k / figs.length) * Math.PI * 2 + 1.05;
        var el = [0.48, -0.42, 0.28, -0.22, 0.55, -0.50, 0.12, -0.08, 0.38, -0.35, 0.18, -0.55][k % 12];
        var n = f.stars.length;
        var W = 1100 + n * 40;
        var H = W / Math.max(0.5, f.ar || 1);
        var brightSet = {};
        (f.bright || []).forEach(function(bi){ brightSet[bi] = true; });
        var pos = new Float32Array(n * 3);
        var col = new Float32Array(n * 3);
        var size = new Float32Array(n);
        var alpha = new Float32Array(n);
        var baseA = new Float32Array(n);
        var spd = new Float32Array(n);
        var phase = new Float32Array(n);
        for (var i = 0; i < n; i++){
          pos[i*3]   = (f.stars[i][0] - 0.5) * W;
          pos[i*3+1] = (0.5 - f.stars[i][1]) * H;
          pos[i*3+2] = (Math.random() - 0.5) * 10;
          var isB = !!brightSet[i];
          /* 冷白 / 淡蓝天文色，与手稿暖金区分 */
          var tint = Math.random();
          var cr, cg, cb;
          if (tint < 0.45)      { cr = 0.82; cg = 0.90; cb = 1.0; }
          else if (tint < 0.80) { cr = 0.95; cg = 0.97; cb = 1.0; }
          else                  { cr = 0.70; cg = 0.80; cb = 1.0; }
          var lum = (isB ? 1.25 : 0.85) * (0.85 + Math.random() * 0.25);
          col[i*3] = cr * lum; col[i*3+1] = cg * lum; col[i*3+2] = cb * lum;
          size[i]  = isB ? (18 + Math.random() * 10) : (7 + 10 * Math.pow(Math.random(), 1.8));
          baseA[i] = isB ? 0.98 : 0.55 + Math.random() * 0.35;
          alpha[i] = baseA[i];
          spd[i]   = 0.06 + Math.random() * 0.22;
          phase[i] = Math.random() * Math.PI * 2;
        }
        var geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("col",   new THREE.BufferAttribute(col, 3));
        geo.setAttribute("size",  new THREE.BufferAttribute(size, 1));
        geo.setAttribute("alpha", new THREE.BufferAttribute(alpha, 1));
        var mat = new THREE.ShaderMaterial({
          uniforms: { tex: { value: GLOW_TEX } },
          vertexShader: LIANG_STAR_SHADER.vertex,
          fragmentShader: LIANG_STAR_SHADER.fragment,
          transparent: true, blending: THREE.AdditiveBlending,
          depthWrite: false, fog: false
        });
        var pts = new THREE.Points(geo, mat);
        pts.renderOrder = -32;
        g.add(pts);
        var links = f.links || [];
        var lp = new Float32Array(links.length * 6);
        for (var li = 0; li < links.length; li++){
          var a = links[li][0], b = links[li][1];
          lp[li*6]   = pos[a*3];   lp[li*6+1] = pos[a*3+1]; lp[li*6+2] = pos[a*3+2];
          lp[li*6+3] = pos[b*3];   lp[li*6+4] = pos[b*3+1]; lp[li*6+5] = pos[b*3+2];
        }
        var lgeo = new THREE.BufferGeometry();
        lgeo.setAttribute("position", new THREE.BufferAttribute(lp, 3));
        var lines = new THREE.LineSegments(lgeo, new THREE.LineBasicMaterial({
          color: 0x8EB6D4, transparent: true, opacity: 0.28,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        lines.renderOrder = -33;
        g.add(lines);
        g.position.set(R * Math.cos(el) * Math.cos(az), R * Math.sin(el), R * Math.cos(el) * Math.sin(az));
        g.lookAt(0, 0, 0);
        g.raycast = function(){};
        astroSky.add(g);
        astroFigs.push({ pts: pts, lines: lines, baseA: baseA, spd: spd, phase: phase, count: n });
      });
      scene.add(astroSky);
    }

    /* ─── 移动端：侧栏缩放 + 防误触 / 防浏览器手势 ─── */
    var ZOOM_MIN = 55;
    var ZOOM_MAX = 2200;
    function camDist(){
      var cam = Graph.camera();
      var t = controls.target;
      return Math.hypot(cam.position.x - t.x, cam.position.y - t.y, cam.position.z - t.z);
    }
    function setCamDist(dist){
      dist = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, dist));
      var cam = Graph.camera();
      var t = controls.target;
      var dx = cam.position.x - t.x, dy = cam.position.y - t.y, dz = cam.position.z - t.z;
      var len = Math.hypot(dx, dy, dz) || 1;
      var k = dist / len;
      cam.position.set(t.x + dx * k, t.y + dy * k, t.z + dz * k);
      controls.update();
    }
    function distToSlider(d){
      var t = Math.log(d / ZOOM_MIN) / Math.log(ZOOM_MAX / ZOOM_MIN);
      return Math.round(Math.max(0, Math.min(1, t)) * 1000);
    }
    function sliderToDist(v){
      var t = Math.max(0, Math.min(1, Number(v) / 1000));
      return ZOOM_MIN * Math.pow(ZOOM_MAX / ZOOM_MIN, t);

        zoomSlider.addEventListener("touchmove", function(e){ e.stopPropagation(); }, {passive:true});
      }
      /* 防下拉刷新 / 防页面滚动：仅允许卡片与面板内滚动 */
      document.addEventListener("touchmove", function(e){
        var t = e.target;

      var guardRoot = document.getElementById("graph") || document.body;
      guardRoot.addEventListener("touchstart", function(e){
        if (e.touches.length > 1){
          touchGuard.multi = true;
          touchGuard.suppressUntil = Date.now() + 450;
          return;
        }
        touchGuard.moved = false;
        touchGuard.sx = e.touches[0].clientX;
        touchGuard.sy = e.touches[0].clientY;
      }, {passive:true});
      guardRoot.addEventListener("touchmove", function(e){
        if (e.touches.length > 1){
          touchGuard.multi = true;
          touchGuard.suppressUntil = Date.now() + 450;
          return;
        }
        if (!e.touches[0]) return;
        var dx = e.touches[0].clientX - touchGuard.sx;
        var dy = e.touches[0].clientY - touchGuard.sy;
        if (dx * dx + dy * dy > 64) touchGuard.moved = true;
      }, {passive:true});
      guardRoot.addEventListener("touchend", function(){
        if (touchGuard.moved || touchGuard.multi){

    /* ─── 高亮 ─── */
    var highlightNodes = {};
    var highlightLinks = {};
    /* v7: hover 只加亮，不灭掉其他节点 */
    function applyHighlight(){
      var any = Object.keys(highlightNodes).length > 0;
      var g = Graph.graphData();
      (g.nodes || []).forEach(function(n){
        if (!n.__mat) return;
        var w = any && highlightNodes.hasOwnProperty(n.id) ? highlightNodes[n.id] : 0;
        var sw = (n.__searchW == null) ? 1 : n.__searchW;
        /* 未命中保持原明度；命中只提升自发光；检索淡出权重不可被 hover 冲掉 */
        n.__mat.opacity = Math.max(NODE_MIN_OPACITY, n.__baseOpacity) * sw;
        var em = any
          ? n.__baseEmissive * (w > 0 ? (1.15 + w * 0.85) : 1.0)
          : n.__baseEmissive;
        n.__mat.emissiveIntensity = Math.max(NODE_MIN_EMISSIVE, em) * sw;
        if (n.__halo){
          n.__halo.material.opacity = Math.max(
            NODE_MIN_HALO,
            any ? n.__baseHalo * (w > 0 ? (1.1 + w * 0.7) : 1.0) : n.__baseHalo
          ) * sw;
        }
        if (labelEls[n.id]){
          labelEls[n.id].classList.toggle("hovered", !!(any && w > 0.5 && sw > 0.05));
        }
      });
      (g.links || []).forEach(function(l){
        if (!l.__mesh) return;
        var k = linkKey(l);
        var w = any && highlightLinks.hasOwnProperty(k) ? highlightLinks[k] : 0;
        var sN = (typeof l.source === "object") ? l.source : nodeById(l.source);
        var tN = (typeof l.target === "object") ? l.target : nodeById(l.target);
        var lsw = Math.min(
          (sN && sN.__searchW != null) ? sN.__searchW : 1,
          (tN && tN.__searchW != null) ? tN.__searchW : 1
        );
        /* 连线：未高亮保持可读，高亮略加强；同样乘上检索淡出 */
        l.__mesh.material.opacity = Math.max(
          LINK_MIN_OPACITY,
          any ? (w > 0 ? 0.55 + w * 0.4 : 0.28) : 0.32
        ) * lsw;
      });
    }
    var _hoveredNode = null;
    var _hoverMaxDist = 0;

    /* ─── hover 前计算各节点的距离权重 ─── */
    function calcDistWeights(refNode){
      var ws = {};
      var max = 0;
      DATA.nodes.forEach(function(n){
        var dx = (refNode.x||0)-(n.x||0);
        var dy = (refNode.y||0)-(n.y||0);
        var dz = (refNode.z||0)-(n.z||0);
        var d = Math.sqrt(dx*dx+dy*dy+dz*dz);
        ws[n.id] = d;
        if (d > max) max = d;
      });
      return { weights: ws, maxDist: max || 1 };
    }

    function hoverNode(node){
      highlightNodes = {}; highlightLinks = {};
      _hoveredNode = node;
      if (node){
        var dw = calcDistWeights(node);
        _hoverMaxDist = dw.maxDist;

        // hover 节点自身权重最大
        highlightNodes[node.id] = 1.0;
        // 邻居按距离衰减
        (node.neighbors || []).forEach(function(nb){
          var nid = (nb && nb.id) ? nb.id : nb;
          var d = dw.weights[nid] || _hoverMaxDist;
          var w = Math.max(0.25, 1 - d / (_hoverMaxDist * 2.5));
          highlightNodes[nid] = w;
        });
        (node.links || []).forEach(function(l){
          var k = linkKey(l);
          var sId = (typeof l.source==="object")?l.source.id:l.source;
          var tId = (typeof l.target==="object")?l.target.id:l.target;
          var d1 = dw.weights[sId] || 0, d2 = dw.weights[tId] || 0;
          var avgD = (d1+d2)/2;
          var w = Math.max(0.2, 1 - avgD / (_hoverMaxDist * 2.2));
          highlightLinks[k] = w;
        });
      }
      applyHighlight();
    }

    /** 按当前卡片语境生成注释；不把短音节做成全局字典 */
    function buildCultureNotes(rawEn, node){
      if (!rawEn) return "";
      var seen = {}, items = [];
      CULTURE_NOTES.forEach(function(cn){
        if (seen[cn.id]) return;
        if (!cn.re.test(rawEn)) return;
        seen[cn.id] = true;
        items.push(cn);
      });
      /* 文献书名里的 Zhi：只在本卡、且确指文体「志」时注一次 */
      if (node && node.type === "literature") {
        var title = node.en || "";
        var name = node.name || "";
        if (/\bZhi\b/.test(title) && /志/.test(name) && !seen["zhi-genre"]) {
          seen["zhi-genre"] = true;
          items.push({
            id: "zhi-genre",
            summary: "Zhi \u2014 gazetteer / memoir genre (\u5FD7)",
            detail: "Here Zhi renders \u5FD7, a Chinese documentary genre (local gazetteers, river treatises, court memoirs). It is not the joinery term for a straight tenon.",
            detailCn: "\u6b64\u5904 Zhi \u5bf9\u5e94\u4e2d\u6587\u300c\u5fd7\u300d\uff0c\u662f\u8bb0\u8ff0\u7c7b\u6587\u4f53\uff08\u65b9\u5fd7\u3001\u53bf\u5fd7\u3001\u6cb3\u5de5\u5fd7\u3001\u5bab\u5ef7\u7b14\u8bb0\u7b49\uff09\uff0c\u4e0e\u69ab\u536f\u300c\u76f4\u69ab\u300d\u65e0\u5173\u3002"
          });
        }
      }
      if (!items.length) return "";
      return '<div class="cul-notes">' +
        items.map(function(cn){
          return '<div class="cul-note" data-cul-id="' + escHtml(cn.id) + '">' +
            '<div class="cul-sum">' + escHtml(cn.summary) + '<span class="cul-arr" aria-hidden="true"></span></div>' +
            '<div class="cul-more">' +
              '<div class="cul-more-en">' + escHtml(cn.detail) + '</div>' +
              '<div class="cul-more-cn">' + escHtml(cn.detailCn) + '</div>' +
            '</div></div>';
        }).join("") + '</div>';
    }

    function glossPinyin(escapedEn){
      if (!escapedEn) return "";
      var parts = escapedEn.split(/(<[^>]+>)/);
      for (var i = 0; i < parts.length; i += 2) {
        var chunk = parts[i];
        PY_GLOSS.forEach(function(g){
          chunk = chunk.replace(g.re, function(mm){
            return '<span class="py-term" data-cn="' + g.cn + '">' + mm + '</span>';
          });
        });
        parts[i] = chunk;
      }
      return parts.join("");
    }
    /** 知识卡片正文适当换行：按句读切成段落；中文正文顺带高亮榫名 */
    function formatCardText(text, isEn, selfId){
      var raw = escHtml(text).trim();
      if (!raw) return "";
      if (!isEn) raw = linkifyMortise(raw, selfId);
      else raw = glossPinyin(raw);
      var parts;
      if (isEn) {
        parts = raw.split(/(?<=[.!?])\s+/);
      } else {
        parts = raw.split(/(?<=[。！？；])\s*/);
      }
      parts = parts.map(function(p){ return p.trim(); }).filter(Boolean);
      if (parts.length <= 1) return "<p>" + raw + "</p>";
      return parts.map(function(p){ return "<p>" + p + "</p>"; }).join("");
    }
    function showDetail(node){

      document.getElementById("detailName").textContent = node.name;
      document.getElementById("detailEn").innerHTML = glossPinyin(escHtml(node.en || ""));
      var html = "";

      if (node.illus) {
        var illusCls = "illus-wrap" + (node.illusStyle === "photo" ? " photo" : "");
        html += '<div class="' + illusCls + '"><img src="' + escHtml(node.illus) + '" alt="' + escHtml(node.name) + ' 插图" loading="lazy"></div>';
      }

      var enRaw = node.enDetail || node.enDesc || "";
      var cnPart = formatCardText(node.detail || node.desc || "", false, node.id);
      var enPart = formatCardText(enRaw, true, node.id);
      if (cnPart || enPart) {
        html += '<div class="desc">';
        if (cnPart) html += '<div class="cn-block">' + cnPart + '</div>';
        if (enPart) html += '<div class="en-block">' + enPart + buildCultureNotes(enRaw, node) + '</div>';
        html += '</div>';

      /* v5 相关节点按类型染色；去重计数，未点亮的条目降透明度（虚线边） */
      var _relSeen = {};
